<!doctype html>
<!-- Mock-up only (Nov 12, 2026): the counter round as a mixing bench. A still picture to judge the
     look; nothing here is in the game. The bench is blender/previews/bench-mockup.png and the labels
     are set on it from bench-points.js (both written by blender/bench-mockup.py). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixing bench mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  .top { position: absolute; left: 0; right: 0; top: 0; height: 46px; justify-content: space-between; }
  .top h1 { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; }
  .timer { height: 28px; padding: 0 10px; border-radius: 14px; border: 1.5px solid var(--brass); color: #ffe7b0; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .timer small { font-weight: 600; font-size: 11px; color: #e6c98f; }
  .brief { position: absolute; left: 8px; right: 8px; top: 52px; height: 54px; padding: 5px 12px; border-left: 4px solid var(--burgundy); }
  .brief q { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 16px; quotes: "\201C" "\201D"; }
  .brief p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
  .brief p b { color: var(--ink); }
  .radar { position: absolute; left: 8px; top: 112px; width: 262px; height: 186px; }
  .radar svg { width: 100%; height: 100%; display: block; }
  .radar-ring, .radar-axis { fill: none; stroke: #d9c19c; stroke-width: 1; }
  .radar-label { font: 600 9.5px var(--body); fill: var(--muted); }
  .radar-mix { fill: rgba(142, 43, 61, 0.28); stroke: var(--burgundy); stroke-width: 2; stroke-linejoin: round; }
  .radar-ghost { fill: none; stroke: var(--forest); stroke-width: 2; stroke-dasharray: 4 3; stroke-linecap: round; }
  .radar-ghost-dot { fill: var(--forest); }
  .radar-key { font: 600 9px var(--body); fill: var(--muted); }
  .slip { position: absolute; left: 278px; top: 112px; width: 176px; height: 186px; padding: 5px 10px 5px 12px; }
  .slip h2 { margin: 0; font: 700 22px/1 var(--hand); display: flex; justify-content: space-between; align-items: baseline; }
  .slip h2 span { font: 700 11px var(--body); color: var(--muted); }
  .slip ul { list-style: none; margin: 4px 0 0; padding: 0; }
  .slip li { display: flex; align-items: center; gap: 6px; min-height: 30px; border-top: 1px dotted #cdb188; font-weight: 700; font-size: 12.5px; line-height: 1.1; }
  .slip li span { flex: 1; }
  .slip li b { font: 700 19px/1 var(--hand); color: var(--burgundy); }
  .slip .note { margin: 3px 0 0; font: 500 17px/1 var(--hand); color: var(--forest); }
  .plate { position: absolute; transform: translate(-50%, -50%); text-align: center; font-weight: 800; font-size: 11.5px; line-height: 1.02; color: var(--ink); display: flex; align-items: center; justify-content: center; height: 32px; }
  .on { position: absolute; transform: translate(-50%, -50%); box-shadow: 0 1px 3px rgba(40, 20, 10, 0.4); }
  .display { position: absolute; transform: translate(-50%, -50%); font: 800 13px var(--body); color: #f5cf63; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .hint { position: absolute; left: 42px; top: 480px; width: 116px; padding: 5px 8px 6px; background: var(--parchment-lt); border: 1px solid #cdb188; border-radius: 3px; font: 500 15.5px/1.05 var(--hand); color: var(--ink); transform: rotate(-3deg); box-shadow: 0 2px 4px rgba(40, 20, 10, 0.3); }
  .tabs { position: absolute; left: 0; right: 0; top: 906px; height: 30px; display: flex; align-items: center; gap: 5px; padding: 0 8px; overflow: hidden; }
  .tab { height: 24px; padding: 0 9px; border-radius: 12px; background: rgba(252, 244, 227, 0.92); border: 1.5px solid var(--line); border-bottom-width: 3px; font-weight: 700; font-size: 11.5px; white-space: nowrap; display: inline-flex; align-items: center; }
  .tab--on { background: var(--walnut); color: #fff1d6; border-color: var(--brass); }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 62px; justify-content: space-between; }
</style>
</head>
<body>
<div class="phone">
  <img class="bg" src="../../blender/previews/bench-mockup.png" alt="">

  <header class="woodbar woodbar--top top">
    <button class="link">Later</button>
    <h1>Clara</h1>
    <span class="timer">0:38 <small>quick tip</small></span>
  </header>

  <section class="sheet brief">
    <q>Something bright, with a floral side to it.</q>
    <p>Wanted: <b>light</b> &middot; yours so far: <b>light</b></p>
  </section>

  <section class="sheet radar" id="radar"></section>

  <section class="sheet slip">
    <h2>Formula <span>7 drops</span></h2>
    <ul>
      <li><span>Bergamot</span><b>&times;3</b><button class="minus">&minus;</button></li>
      <li><span>Hedione</span><b>&times;2</b><button class="minus">&minus;</button></li>
      <li><span>Lemon</span><b>&times;1</b><button class="minus">&minus;</button></li>
      <li><span>Labdanum resinoid</span><b>&times;1</b><button class="minus">&minus;</button></li>
    </ul>
    <p class="note">leans bright &amp; floral</p>
  </section>

  <div id="marks"></div>

  <nav class="tabs">
    <span class="tab tab--on">All</span>
    <span class="tab" style="border-bottom-color:#F2CB52">Citrus</span>
    <span class="tab" style="border-bottom-color:#86C6EC">Fresh</span>
    <span class="tab" style="border-bottom-color:#86CC82">Green</span>
    <span class="tab" style="border-bottom-color:#F091B3">Floral</span>
    <span class="tab" style="border-bottom-color:#B67C4E">Woody</span>
    <span class="tab" style="border-bottom-color:#E8923F">Amber</span>
    <span class="tab" style="border-bottom-color:#D69CCB">Gourmand</span>
    <span class="tab" style="border-bottom-color:#DB6A52">Spicy</span>
  </nav>

  <footer class="woodbar woodbar--bottom bottom">
    <button class="btn btn--paper">Test &middot; 2</button>
    <button class="link">Pour out</button>
    <button class="btn btn--primary">Hand over</button>
  </footer>
</div>

<script src="bench-points.js"></script>
<script>
  // The radar: the same data chart as the game (src/ui/radar.ts), in the draft colours.
  const SPOKES = ["Citrus", "Fresh", "Green", "Floral", "Woody", "Amber", "Gourmand", "Spicy"];
  const MIX = [4.4, 2.5, 0, 2.6, 0.3, 1, 0.2, 0.3], WISH = [4.9, 2.2, 0.4, 3.7, 0.2, 0.6, 0.3, 0.2], SCALE = 5.6, R = 66;
  const ang = (i) => -Math.PI / 2 + (i * 2 * Math.PI) / SPOKES.length;
  const pt = (i, v) => [Math.cos(ang(i)) * R * Math.min(1.1, v / SCALE), Math.sin(ang(i)) * R * Math.min(1.1, v / SCALE)];
  const f = ([x, y]) => x.toFixed(1) + "," + y.toFixed(1);
  const rings = [1 / 3, 2 / 3, 1].map((k) => `<polygon class="radar-ring" points="${SPOKES.map((_, i) => f(pt(i, SCALE * k))).join(" ")}"/>`).join("");
  const axes = SPOKES.map((s, i) => {
    const [x, y] = pt(i, SCALE);
    const lx = Math.cos(ang(i)) * (R + 11), ly = Math.sin(ang(i)) * (R + 11);
    const anchor = Math.abs(lx) < 4 ? "middle" : lx > 0 ? "start" : "end";
    return `<line class="radar-axis" x1="0" y1="0" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="radar-label" x="${lx.toFixed(1)}" y="${(ly + 3.5).toFixed(1)}" text-anchor="${anchor}">${s}</text>`;
  }).join("");
  // What the customer asked for shows only on the spokes the brief named, as in the game.
  const ghost = [0, 3].map((i) => {
    const n = SPOKES.length, here = pt(i, WISH[i]);
    const prev = pt((i + n - 1) % n, WISH[(i + n - 1) % n]), next = pt((i + 1) % n, WISH[(i + 1) % n]);
    const mid = (a) => [(a[0] + here[0]) / 2, (a[1] + here[1]) / 2];
    return `<polyline class="radar-ghost" points="${f(mid(prev))} ${f(here)} ${f(mid(next))}"/><circle class="radar-ghost-dot" cx="${here[0].toFixed(1)}" cy="${here[1].toFixed(1)}" r="3"/>`;
  }).join("");
  document.getElementById("radar").innerHTML = `<svg viewBox="-131 -91 262 186">${rings}${axes}<polygon class="radar-mix" points="${MIX.map((v, i) => f(pt(i, v))).join(" ")}"/>${ghost}
    <line class="radar-ghost" x1="-124" y1="88" x2="-108" y2="88"/><text class="radar-key" x="-104" y="91">their wish</text></svg>`;

  // Labels set on the picture.
  const W = 462, H = 1000, B = window.BENCH, marks = document.getElementById("marks");
  const NAMES = { bergamot: "Bergamot", lemon: "Lemon", lavender: "Lavender", hedione: "Hedione", "cedarwood-virginia": "Cedarwood Virginia", patchouli: "Patchouli", labdanum: "Labdanum resinoid", vanillin: "Vanillin" };
  const DROPS = { bergamot: 3, hedione: 2, lemon: 1, labdanum: 1 };
  let html = "";
  for (const [id, b] of Object.entries(B.bottles)) {
    const w = Math.abs(b.left[0] - b.right[0]) * W - 14;
    html += `<div class="plate" style="left:${b.plate[0] * W}px;top:${b.plate[1] * H}px;width:${w}px"><span>${NAMES[id]}</span></div>`;
    if (DROPS[id]) html += `<span class="count on" style="left:${b.plate[0] * W + 21}px;top:${b.top[1] * H + 16}px">${DROPS[id]}</span>`;
  }
  html += `<span class="display" style="left:${B.display[0] * W}px;top:${B.display[1] * H}px">7 drops</span>`;
  html += `<span class="hint">Let go over the beaker for one drop. Hold to keep dripping.</span>`;
  marks.innerHTML = html;
</script>
</body>
</html>
